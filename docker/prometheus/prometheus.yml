global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cs2-cheat-detection'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Python worker metrics (prometheus_client)
  - job_name: 'python-worker'
    static_configs:
      - targets: ['python:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # PHP API metrics (if Symfony has prometheus client)
  - job_name: 'php-api'
    static_configs:
      - targets: ['php:9000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    scrape_timeout: 10s
