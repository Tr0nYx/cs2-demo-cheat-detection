name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: '3.12'
  PHP_VERSION: '8.2'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cs2_test
          POSTGRES_USER: cs2_app
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}

    - name: Install PHP dependencies
      run: cd symfony && composer install --no-interaction --prefer-dist

    - name: Run PHP tests
      run: cd symfony && php bin/phpunit
      env:
        DATABASE_URL: postgresql://cs2_app:test_password@127.0.0.1:5432/cs2_test
      continue-on-error: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements.txt
        pip install pytest pytest-cov pyyaml

    - name: Run Python unit tests (no docker required)
      run: python -m pytest python/tests/ -v -m "not integration" --tb=short
      continue-on-error: false

  integration-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements.txt
        pip install pytest pytest-cov pyyaml requests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Start docker-compose stack
      run: |
        docker-compose -f docker-compose.prod.yml up -d
        echo "Waiting for services to stabilize..."
        sleep 30

    - name: Run integration tests
      run: python -m pytest python/tests/test_integration_phase7.py -v -m "integration" --tb=short
      continue-on-error: true

    - name: Check docker-compose health
      if: always()
      run: docker-compose -f docker-compose.prod.yml ps

    - name: Capture service logs on failure
      if: failure()
      run: |
        echo "=== Python Worker Logs ===" && docker logs cs2-python || true
        echo "=== PHP Logs ===" && docker logs cs2-php || true
        echo "=== Postgres Logs ===" && docker logs cs2-postgres || true

    - name: Cleanup stack
      if: always()
      run: docker-compose -f docker-compose.prod.yml down

  linting:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install lint tools
      run: |
        pip install flake8 black pylint

    - name: Run Python linting (flake8)
      run: python -m flake8 python/ --max-line-length=120 --ignore=E501,W503 --exclude=__pycache__,*.pyc
      continue-on-error: true

    - name: Check code formatting (black)
      run: python -m black python/ --check --line-length=120
      continue-on-error: true

  compose-validation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate docker-compose.prod.yml
      run: |
        pip install pyyaml
        python3 -c "import yaml; yaml.safe_load(open('docker-compose.prod.yml')); print('YAML valid')"
