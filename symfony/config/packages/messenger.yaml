framework:
    messenger:
        failure_transport: failed

        transports:
            analysis_dispatch:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: '%env(SYMFONY_ANALYSIS_QUEUE)%'
            import_dispatch:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: cs2.import
            steam_profile_refresh:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: cs2.steam_profile
            steam_match_history_tracking:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: cs2.steam_match_history
            failed: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'

        routing:
            'App\Application\Command\ImportDemoMessage': import_dispatch
            'App\Application\Steam\RefreshSteamProfileMessage': steam_profile_refresh
            'App\Application\Steam\TrackSteamMatchHistoryMessage': steam_match_history_tracking
            # Plan 04 adds AnalyzeDemoMessage and routes it once the class exists.

when@test:
   framework:
       messenger:
           transports:
               analysis_dispatch: 'sync://'
               import_dispatch: 'sync://'
               steam_profile_refresh: 'sync://'
               steam_match_history_tracking: 'sync://'
               failed: 'in-memory://'
